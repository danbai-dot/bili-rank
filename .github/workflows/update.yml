name: Update daily rank

on:
  push:
    branches: [main]
  schedule:
    # 00:30 Asia/Shanghai = 前一天 16:30 UTC；统计“昨天”的完整数据
    - cron: '30 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Bilibili data
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs || echo "Fetch failed; continuing with existing data."

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json site/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update daily rank data $(date +%F)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


